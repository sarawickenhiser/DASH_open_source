[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "humanoid-rcm-control"
version = "0.1.0"
description = "RCM alignment and constrained control for a Unitree G1 carrying a dVRK PSM instrument"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
  "numpy>=1.24",
  "proxsuite>=0.7.3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
sim = ["mujoco>=3.2"]

[project.scripts]
humanoid-rcm-demo = "humanoid_rcm.demo:main"
humanoid-rcm-teleop = "humanoid_rcm.teleop:main"
humanoid-rcm-hardware = "humanoid_rcm.hardware.portable_rcm_teleop:main"

[tool.setuptools.packages.find]
where = ["src"]
